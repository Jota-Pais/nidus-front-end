<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Duas vozes tipográficas, como manda o design system: Calistoga em título
      de tela e de seção, Inter em todo o resto. JetBrains Mono entra em rótulo
      de seção e no código de posição da caixa (`A1`, `C3`), que o técnico
      compara varrendo a grade com o olho e precisa alinhar em coluna.

      `display=swap` para o texto aparecer na fonte de sistema enquanto a web
      font carrega — o sistema abre dentro da sala, e nem sempre em rede boa.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Nidus — CPMR/UFSC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
