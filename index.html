<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Ícone da aba: o emblema da equipe, recortado no círculo para ficar nítido em
      16 px. O de 180 px é o do atalho na tela inicial do iPhone, que não aceita
      fundo transparente.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Duas vozes tipográficas, como manda o design system: Plus Jakarta Sans
      em negrito no título de tela e de seção e no nome da logo, Inter em todo
      o resto. JetBrains Mono entra em rótulo
      de seção e no código de posição da caixa (`A1`, `C3`), que o técnico
      compara varrendo a grade com o olho e precisa alinhar em coluna.

      `display=swap` para o texto aparecer na fonte de sistema enquanto a web
      font carrega — o sistema abre dentro da sala, e nem sempre em rede boa.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Nidus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
